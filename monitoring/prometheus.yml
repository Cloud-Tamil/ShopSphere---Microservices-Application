# ShopSphere Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'shopsphere-monitor'
    cluster: 'shopsphere-production'

rule_files:
  # Alert rules can be loaded from /etc/prometheus/alert.rules.yml

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. API Gateway Scrape Target
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8000', 'host.docker.internal:8000']
        labels:
          service: 'api-gateway'
          tier: 'edge'

  # 3. Auth Microservice Scrape Target
  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:5001', 'host.docker.internal:5001']
        labels:
          service: 'auth-service'
          tier: 'backend'

  # 4. User Microservice Scrape Target
  - job_name: 'user-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user-service:5002', 'host.docker.internal:5002']
        labels:
          service: 'user-service'
          tier: 'backend'

  # 5. Order Microservice Scrape Target
  - job_name: 'order-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['order-service:5003', 'host.docker.internal:5003']
        labels:
          service: 'order-service'
          tier: 'backend'

  # 6. Kubernetes Pod Auto-Discovery (Used when deployed in EKS/Minikube)
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - shopsphere
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
